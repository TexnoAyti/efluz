name: Fix smart retry metadata
on:
  push:
    branches:
      - "feat/phase2-ops-career"
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-ops-career
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node scripts/fix-smart-retry-metadata.mjs
      - run: bun install
      - run: bun run lint
      - name: Build and bundle
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: test
        run: bun run build
      - name: Commit generated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/services/smartNotificationService.ts api/index.js api/index.js.map
          git commit -m "fix(telegram): preserve smart retry formatting metadata" || exit 0
          git push origin HEAD:feat/phase2-ops-career
