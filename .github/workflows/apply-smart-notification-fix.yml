name: Apply smart notification fix
on:
  push:
    branches: [fix/smart-notifications-and-admin-users]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-notifications-and-admin-users
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply targeted patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # Admin users: this installation has 68 users; the previous default 25 was only page 1.
          replace('src/server/routes/admin.routes.ts',
              "const limit = req.query.limit ? Math.min(Math.max(1, parseInt(req.query.limit as string, 10)), 50) : 25;",
              "const limit = req.query.limit ? Math.min(Math.max(1, parseInt(req.query.limit as string, 10)), 100) : 100;")
          replace('src/server/firebase/firestoreStore.ts',
              "const pageSize = Math.min(Math.max(options.limit || 25, 1), 50);",
              "const pageSize = Math.min(Math.max(options.limit || 100, 1), 100);")

          # Result submission currently never invokes Smart Notifications.
          replace('src/server/routes/fixtures.routes.ts',
              "import { reconcileDomesticCupSourceFixture } from '../tournament/domesticCupRoundOps';",
              "import { reconcileDomesticCupSourceFixture } from '../tournament/domesticCupRoundOps';\nimport { notifySmartResultLifecycle } from '../services/smartNotificationService';")
          replace('src/server/routes/fixtures.routes.ts',
              "    await refreshChangedFixtureReadModel(fixtureId)\n      .catch(() => invalidateFixtureReadModels(updatedFixture.competitionId, updatedFixture.seasonId || 'season-2026-27'))\n      .catch(() => {});\n\n    res.json({",
              "    await refreshChangedFixtureReadModel(fixtureId)\n      .catch(() => invalidateFixtureReadModels(updatedFixture.competitionId, updatedFixture.seasonId || 'season-2026-27'))\n      .catch(() => {});\n\n    // Smart alerts are best-effort and must never make a valid result submission fail.\n    await notifySmartResultLifecycle(updatedFixture, userId).catch((error: any) => {\n      console.warn('[SMART_NOTIFY] Result lifecycle notification failed:', error?.message || error);\n    });\n\n    res.json({")

          # Queue jobs can carry trusted smart-message HTML and inline buttons.
          replace('src/server/services/telegramNotificationQueue.ts',
              "  error?: string;\n}",
              "  error?: string;\n  bodyIsHtml?: boolean;\n  replyMarkup?: any;\n}")
          replace('src/server/services/telegramNotificationQueue.ts',
              "      const result = await sendTelegramMessage(job.telegramId!, formatTelegramMessage(job.title, job.body, job.type), { parse_mode: 'HTML' });",
              "      const result = await sendTelegramMessage(\n        job.telegramId!,\n        formatTelegramMessage(job.title, job.body, job.type, Boolean(job.bodyIsHtml)),\n        { parse_mode: 'HTML', reply_markup: job.replyMarkup }\n      );")
          old_fmt = """function formatTelegramMessage(title: string, body: string, type: string): string {\n  let icon = '📢';\n  if (type === 'NEW_MATCHDAY') icon = '⚽';\n  if (type === 'UPCOMING_MATCH') icon = '⏰';\n  if (type === 'COMPETITION_UPDATE') icon = '🏆';\n\n  return `<b>${icon} EFL UZ Official Alert</b>\\n\\n` +\n         `<b>${escapeHtml(title)}</b>\\n\\n` +\n         `${escapeHtml(body)}\\n\\n` +\n         `<i>Season 2026/27 • Open EFL WebApp to manage fixtures</i>`;\n}"""
          new_fmt = """function formatTelegramMessage(title: string, body: string, type: string, bodyIsHtml = false): string {\n  let icon = '📢';\n  if (type === 'NEW_MATCHDAY') icon = '⚽';\n  if (type === 'UPCOMING_MATCH') icon = '⏰';\n  if (type === 'COMPETITION_UPDATE') icon = '🏆';\n\n  // No permanent \"Official Alert\" header/footer. Smart bodies are generated server-side\n  // and may contain a small, controlled HTML subset; admin-entered bodies stay escaped.\n  const safeBody = bodyIsHtml ? body : escapeHtml(body);\n  return `<b>${icon} ${escapeHtml(title)}</b>\\n\\n${safeBody}`;\n}"""
          replace('src/server/services/telegramNotificationQueue.ts', old_fmt, new_fmt)

          # Smart queue supports inline buttons and preserves its server-generated HTML.
          replace('src/server/services/smartNotificationService.ts',
              "  availableAt: number;\n}",
              "  availableAt: number;\n  bodyIsHtml?: boolean;\n  replyMarkup?: any;\n}")
          replace('src/server/services/smartNotificationService.ts',
              "  body: string;\n}): Promise<boolean> {",
              "  body: string;\n  replyMarkup?: any;\n}): Promise<boolean> {")
          replace('src/server/services/smartNotificationService.ts',
              "    availableAt: Date.now(),\n  };",
              "    availableAt: Date.now(),\n    bodyIsHtml: true,\n    replyMarkup: params.replyMarkup,\n  };")

          marker = """function clubName(fixture: Fixture, side: 'home' | 'away'): string {\n  return side === 'home'\n    ? (fixture.homeClub?.name || fixture.homeClubId || 'Home')\n    : (fixture.awayClub?.name || fixture.awayClubId || 'Away');\n}\n"""
          helper = marker + """\nconst RESULT_TOPIC_BY_LEAGUE: Record<string, string> = {\n  'league-premier-league': 'https://t.me/efleagueuz/2',\n  'league-la-liga': 'https://t.me/efleagueuz/3',\n  'league-serie-a': 'https://t.me/efleagueuz/4',\n  'league-bundesliga': 'https://t.me/efleagueuz/5',\n  'league-ligue-1': 'https://t.me/efleagueuz/6',\n};\n\nfunction resultTopicUrl(fixture: Fixture): string {\n  const competition = `${fixture.competitionId || ''} ${fixture.competitionName || ''}`.toLowerCase();\n  if (competition.includes('super')) return 'https://t.me/efleagueuz/2335';\n  if (competition.includes('champions') || competition.includes('ucl')) return 'https://t.me/efleagueuz/7';\n  if (competition.includes('cup') || competition.includes('pokal') || competition.includes('copa') || competition.includes('coppa') || competition.includes('coupe')) {\n    return 'https://t.me/efleagueuz/8';\n  }\n  const leagueId = fixture.homeClub?.leagueId || fixture.awayClub?.leagueId || '';\n  return RESULT_TOPIC_BY_LEAGUE[leagueId] || 'https://t.me/efleagueuz';\n}\n\nasync function fixtureReplyMarkup(fixture: Fixture, opponentUserId?: string) {\n  const rows: any[][] = [];\n  if (opponentUserId) {\n    const opponent = await getCachedRecipient(opponentUserId, fixture.seasonId || 'season-2026-27');\n    const username = String(opponent?.username || '').replace(/^@+/, '').trim();\n    if (username) rows.push([{ text: `👤 Raqib: @${username}`, url: `https://t.me/${username}` }]);\n  }\n  rows.push([{ text: '📸 O‘yin natijasini bu yerga tashlang', url: resultTopicUrl(fixture) }]);\n  return { inline_keyboard: rows };\n}\n\nasync function opponentText(userId: string | undefined, seasonId: string): Promise<string> {\n  if (!userId) return 'Raqib';\n  const recipient = await getCachedRecipient(userId, seasonId);\n  const username = String(recipient?.username || '').replace(/^@+/, '').trim();\n  if (username) return `@${escapeHtml(username)}`;\n  return escapeHtml(recipient?.displayName || 'Raqib');\n}\n"""
          replace('src/server/services/smartNotificationService.ts', marker, helper)

          # Matchday-open messages: include opponent user and two inline actions.
          replace('src/server/services/smartNotificationService.ts',
              """      const opponent = escapeHtml(clubName(fixture, 'away'));\n      tasks.push(enqueueSmartTelegramNotification({\n        userId: homeUserId,\n        seasonId: params.seasonId,\n        eventId: `matchday-open:${params.competitionId}:${params.matchday}:${fixture.id}:${params.deadlineAt || ''}`,\n        title: '🚀 Matchday ochildi',\n        body: `${context}\\n\\nSizning raqibingiz: <b>${opponent}</b>${deadline ? `\\n⏳ Deadline: <b>${deadline}</b>` : ''}\\n\\nO‘yinni o‘tkazing va natijani EFL UZ orqali yuboring.`,\n      }));""",
              """      const opponent = escapeHtml(clubName(fixture, 'away'));\n      const opponentUser = await opponentText(awayUserId, params.seasonId);\n      tasks.push(enqueueSmartTelegramNotification({\n        userId: homeUserId,\n        seasonId: params.seasonId,\n        eventId: `matchday-open:${params.competitionId}:${params.matchday}:${fixture.id}:${params.deadlineAt || ''}`,\n        title: '🚀 Matchday ochildi',\n        body: `${context}\\n\\nRaqib klub: <b>${opponent}</b>\\nRaqib user: <b>${opponentUser}</b>${deadline ? `\\n⏳ Deadline: <b>${deadline}</b>` : ''}\\n\\nO‘yinni o‘tkazing va natijani yuboring.`,\n        replyMarkup: await fixtureReplyMarkup(fixture, awayUserId),\n      }));""")
          replace('src/server/services/smartNotificationService.ts',
              """      const opponent = escapeHtml(clubName(fixture, 'home'));\n      tasks.push(enqueueSmartTelegramNotification({\n        userId: awayUserId,\n        seasonId: params.seasonId,\n        eventId: `matchday-open:${params.competitionId}:${params.matchday}:${fixture.id}:${params.deadlineAt || ''}`,\n        title: '🚀 Matchday ochildi',\n        body: `${context}\\n\\nSizning raqibingiz: <b>${opponent}</b>${deadline ? `\\n⏳ Deadline: <b>${deadline}</b>` : ''}\\n\\nO‘yinni o‘tkazing va natijani EFL UZ orqali yuboring.`,\n      }));""",
              """      const opponent = escapeHtml(clubName(fixture, 'home'));\n      const opponentUser = await opponentText(homeUserId, params.seasonId);\n      tasks.push(enqueueSmartTelegramNotification({\n        userId: awayUserId,\n        seasonId: params.seasonId,\n        eventId: `matchday-open:${params.competitionId}:${params.matchday}:${fixture.id}:${params.deadlineAt || ''}`,\n        title: '🚀 Matchday ochildi',\n        body: `${context}\\n\\nRaqib klub: <b>${opponent}</b>\\nRaqib user: <b>${opponentUser}</b>${deadline ? `\\n⏳ Deadline: <b>${deadline}</b>` : ''}\\n\\nO‘yinni o‘tkazing va natijani yuboring.`,\n        replyMarkup: await fixtureReplyMarkup(fixture, homeUserId),\n      }));""")

          # First result submission: tell the opponent who submitted it and give direct actions.
          replace('src/server/services/smartNotificationService.ts',
              """    await enqueueSmartTelegramNotification({\n      userId: opponentId,\n      seasonId,\n      eventId: `${eventBase}:verify:${actorUserId}`,\n      title: '⚡ Natijani tasdiqlang',\n      body: `${context}\\n\\n${score}\\n\\nRaqib natijani yubordi. EFL UZ ilovasini ochib hisobni tekshiring va tasdiqlang.`,\n    });""",
              """    const actorUser = await opponentText(actorUserId, seasonId);\n    await enqueueSmartTelegramNotification({\n      userId: opponentId,\n      seasonId,\n      eventId: `${eventBase}:verify:${actorUserId}`,\n      title: '⚡ Natijani tasdiqlang',\n      body: `${context}\\n\\n${score}\\n\\nNatijani yuborgan raqib: <b>${actorUser}</b>\\nHisobni tekshirib, o‘z natijangizni yuboring.`,\n      replyMarkup: await fixtureReplyMarkup(fixture, actorUserId),\n    });""")

          # Next-fixture message also carries opponent user and result-topic button.
          replace('src/server/services/smartNotificationService.ts',
              """    const opponent = escapeHtml(clubName(next, isHome ? 'away' : 'home'));\n    const when = formatUtcDeadline(next.scheduledAt);\n    await enqueueSmartTelegramNotification({\n      userId: side.userId,\n      seasonId,\n      eventId: `next-fixture:${fixture.id}:${next.id}`,\n      title: '🎯 Keyingi raqib tayyor',\n      body: `${contextLine(next)}\\n\\nKeyingi raqibingiz: <b>${opponent}</b>${when ? `\\n🗓 Vaqt: <b>${when}</b>` : ''}\\n\\nMatch tafsilotlari EFL UZ ilovasida.`,\n    });""",
              """    const opponentSide = isHome ? 'away' : 'home';\n    const opponentId = ownerId(next, opponentSide);\n    const opponent = escapeHtml(clubName(next, opponentSide));\n    const opponentUser = await opponentText(opponentId, seasonId);\n    const when = formatUtcDeadline(next.scheduledAt);\n    await enqueueSmartTelegramNotification({\n      userId: side.userId,\n      seasonId,\n      eventId: `next-fixture:${fixture.id}:${next.id}`,\n      title: '🎯 Keyingi raqib tayyor',\n      body: `${contextLine(next)}\\n\\nRaqib klub: <b>${opponent}</b>\\nRaqib user: <b>${opponentUser}</b>${when ? `\\n🗓 Vaqt: <b>${when}</b>` : ''}`,\n      replyMarkup: await fixtureReplyMarkup(next, opponentId),\n    });""")
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Rebuild production bundle
        run: bun run build
      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src api/index.js api/index.js.map
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(telegram): restore smart result alerts and recipient UX"
          git push origin HEAD:fix/smart-notifications-and-admin-users
