name: Durable Sync Safety

on:
  push:
    branches:
      - codex/durable-sync-safety

permissions:
  contents: write

jobs:
  verify-and-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Restore baseline phase2 test and seed authoritative replay ownership
        run: python scripts/restorePhase2Test.py
      - name: Apply durable sync safety patch
        run: python scripts/applyDurableSyncSafety.py
      - name: Apply transaction compatibility fix
        run: python scripts/fixDurableSyncMockCompat.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Build and regenerate tracked api bundle
        run: bun run build
      - name: Durable sync worker regression
        run: bun run test:durable-sync-worker
      - name: Phase 2 durability regression
        run: bun run test:phase2-durability
      - name: Read reduction regression
        run: bun run test:read-reduction
      - name: Data propagation regression
        run: bun run test:data-propagation
      - name: Install Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Redis durability regression
        run: bun run test:redis-durability
      - name: Commit verified source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/app.ts src/server/outbox/redisOutbox.ts src/server/sync/mutationQueue.ts src/server/tests/deploymentSelfCheck.ts src/server/tests/durableSyncWorkerRegressionTest.ts src/server/tests/phase2DurableMutationsTest.ts package.json api/index.js api/index.js.map
          git diff --cached --check
          git commit -m "feat(sync): add durable event-driven mutation replay worker"
          git push origin HEAD:codex/durable-sync-safety
