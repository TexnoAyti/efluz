name: Apply phase2 ops career
on:
  push:
    branches:
      - "feat/phase2-ops-career"
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-ops-career
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted patch
        run: |
          node scripts/apply-phase2-ops-career.mjs
          node scripts/fix-phase2-types.mjs
      - name: Install dependencies
        run: bun install
      - name: Result lifecycle contract
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: test
        run: ./node_modules/.bin/tsx src/server/tests/smartResultLifecycleContractTest.ts
      - name: TypeScript
        run: bun run lint
      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: test
        run: bun run build
      - name: Commit generated feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/admin/AdminClubIntegrityPanel.tsx src/components/EflCareerCard.tsx src/components/AdminView.tsx src/components/ProfileView.tsx src/components/admin/AdminTelegramTab.tsx src/lib/api.ts src/server/routes/admin.routes.ts src/server/services/telegramNotificationQueue.ts src/server/services/smartNotificationService.ts src/server/tests/smartResultLifecycleContractTest.ts api/index.js api/index.js.map
          git commit -m "feat(ops): add notification recovery, integrity and career v1" || exit 0
          git push origin HEAD:feat/phase2-ops-career
