name: Smart notification admin controls

on:
  push:
    branches: [feat/smart-notifications-v1]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smart-notifications-v1
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply admin controls
        run: python scripts/applySmartNotificationAdminControls.py

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Read reduction regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:read-reduction

      - name: Data propagation regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:data-propagation

      - name: Matchday lock regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:matchday-locks

      - name: European safety regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:european-safety

      - name: Domestic cup regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:domestic-cup:isolated

      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build

      - name: Commit verified admin controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/smart-notifications-admin-controls.yml scripts/applySmartNotificationAdminControls.py
          git add src/server/services/smartNotificationSettingsService.ts src/server/services/smartNotificationService.ts src/server/routes/admin.routes.ts src/lib/api.ts src/components/admin/AdminTelegramTab.tsx api/index.js api/index.js.map
          git commit -m "feat(notifications): add admin smart notification controls"
          git push origin HEAD:feat/smart-notifications-v1
