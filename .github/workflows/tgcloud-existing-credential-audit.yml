name: TGCloud existing credential names audit (no deploy)
on:
  push:
    branches:
      - feat/tgcloud-round-guide-broadcast-20261120
    paths:
      - .github/workflows/tgcloud-existing-credential-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_TOKEN: ${{ secrets.TGCLOUD_PRODUCTION_TOKEN }}
      PROD_TOKEN: ${{ secrets.TGCLOUD_PROD_TOKEN }}
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      TELEGRAM_CLOUD_TOKEN: ${{ secrets.TELEGRAM_CLOUD_TOKEN }}
      TELEGRAM_SERVERLESS_TOKEN: ${{ secrets.TELEGRAM_SERVERLESS_TOKEN }}
      STAGING_TOKEN: ${{ secrets.TGCLOUD_STAGING_TOKEN }}
    steps:
      - name: Show only credential presence and app identity, never values
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in PRODUCTION_TOKEN PROD_TOKEN TGCLOUD_TOKEN TELEGRAM_CLOUD_TOKEN TELEGRAM_SERVERLESS_TOKEN STAGING_TOKEN; do
            value="${!name-}"
            if [[ -z "$value" ]]; then
              echo "${name}: NOT_CONFIGURED"
            elif [[ "$value" == app8785073471:* ]]; then
              echo "${name}: PRODUCTION_APP_TOKEN_8785073471"
              found=1
            elif [[ "$value" == app8533963416:* ]]; then
              echo "${name}: STAGING_APP_TOKEN_8533963416"
            else
              echo "${name}: PRESENT_BUT_APP_ID_UNCONFIRMED"
            fi
          done
          if [[ "$found" == 1 ]]; then
            echo "PRODUCTION_CREDENTIAL_AVAILABLE_FOR_FUTURE_VERIFIED_READ_ONLY_CHECK"
          else
            echo "NO_MATCHING_PRODUCTION_CREDENTIAL_IN_CHECKED_REPOSITORY_SECRET_NAMES"
          fi
          echo "READ_ONLY; NO_DEPLOY; NO_TOKEN_EXPOSED; NO_WEBHOOK_CHANGE"
