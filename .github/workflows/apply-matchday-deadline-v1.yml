name: Apply matchday deadline v1
on:
  push:
    branches: [feat/matchday-deadline-reminders]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/matchday-deadline-reminders
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Keep the pure selection regression lightweight: only import adminService when sending.
          p = Path('src/server/services/matchdayReminderService.ts')
          s = p.read_text()
          s = s.replace("import { getResultSubmissions } from './adminService';\n", "")
          needle = "  const submissions = await Promise.all(\n    current.map(async (fixture) => {"
          repl = "  const { getResultSubmissions } = await import('./adminService');\n  const submissions = await Promise.all(\n    current.map(async (fixture) => {"
          assert needle in s
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          # Backend endpoint.
          p = Path('src/server/routes/admin.routes.ts')
          s = p.read_text()
          needle = "import { notifySmartMatchdayOpened } from '../services/smartNotificationService';\n"
          repl = needle + "import { notifyOutstandingMatchdayOwners } from '../services/matchdayReminderService';\n"
          assert needle in s and "matchdayReminderService" not in s
          s = s.replace(needle, repl, 1)

          needle = "adminRouter.get('/fixtures/validation', async (req: Request, res: Response) => {"
          endpoint = """adminRouter.post('/competitions/:id/matchday/remind', async (req: Request, res: Response) => {
  const competitionId = req.params.id;
  const seasonId = typeof req.body?.seasonId === 'string' ? req.body.seasonId : 'season-2026-27';
  const matchday = Number(req.body?.matchday || 0);
  const deadlineAt = typeof req.body?.deadlineAt === 'string' ? req.body.deadlineAt : null;
  if (!Number.isInteger(matchday) || matchday <= 0) {
    res.status(400).json({ error: 'A positive integer matchday is required.', code: 'BAD_REQUEST' });
    return;
  }
  try {
    const result = await notifyOutstandingMatchdayOwners({ competitionId, seasonId, matchday, deadlineAt });
    res.json({ success: true, ...result });
  } catch (err: any) {
    handleFirestoreError(res, err, `POST /api/admin/competitions/${competitionId}/matchday/remind`);
  }
});

"""
          assert needle in s and "matchday/remind" not in s
          s = s.replace(needle, endpoint + needle, 1)
          p.write_text(s)

          # API client.
          p = Path('src/lib/api.ts')
          s = p.read_text()
          needle = "  async setCompetitionMatchdayTimer(\n"
          method = """  async sendMatchdayReminders(
    competitionId: string,
    params: { matchday: number; seasonId?: string; deadlineAt?: string | null }
  ): Promise<{
    success: boolean;
    overdue: boolean;
    fixturesChecked: number;
    unfinishedFixtures: number;
    outstandingPlayers: number;
    queued: number;
    skipped: number;
  }> {
    return request(`/api/admin/competitions/${competitionId}/matchday/remind`, {
      method: 'POST',
      body: JSON.stringify(params),
    });
  },

"""
          assert needle in s and "sendMatchdayReminders" not in s
          s = s.replace(needle, method + needle, 1)
          p.write_text(s)

          # Admin handler + UI.
          p = Path('src/components/AdminView.tsx')
          s = p.read_text()
          needle = "  const handleSaveFixtureResult = async (params: { homeScore: number; awayScore: number; status?: string; notes?: string }) => {"
          handler = """  const handleSendMatchdayReminder = async (compId: string, matchday: number, deadlineAt?: string | null) => {
    setIsProcessing(true);
    try {
      const res = await api.sendMatchdayReminders(compId, {
        matchday,
        seasonId: activeSeasonId,
        deadlineAt: deadlineAt || null,
      });
      const status = res.overdue ? 'OVERDUE' : 'active deadline';
      showToast(
        `MD ${matchday} ${status}: ${res.queued}/${res.outstandingPlayers} outstanding player reminder(s) queued.`,
        res.queued > 0 ? 'success' : 'info'
      );
    } catch (err: any) {
      showToast(err.message || 'Failed to send matchday reminders.', 'error');
    } finally {
      setIsProcessing(false);
    }
  };

"""
          assert needle in s and "handleSendMatchdayReminder" not in s
          s = s.replace(needle, handler + needle, 1)

          needle = "                const isOpen = override === 'FORCE_OPEN' || (override !== 'FORCE_LOCKED' && comp.isMatchdayOpen);\n\n                return ("
          repl = "                const isOpen = override === 'FORCE_OPEN' || (override !== 'FORCE_LOCKED' && comp.isMatchdayOpen);\n                const deadlineIsOverdue = Boolean(comp.nextMatchdayOpenAt && Date.now() > new Date(comp.nextMatchdayOpenAt).getTime());\n\n                return ("
          assert needle in s
          s = s.replace(needle, repl, 1)

          needle = """                      {comp.nextMatchdayOpenAt && (
                        <div className=\"text-[10px] text-slate-400 flex items-center gap-1\">
                          <Clock className=\"w-3 h-3 text-slate-500\" />
                          <span>Timer: {new Date(comp.nextMatchdayOpenAt).toLocaleString()}</span>
                        </div>
                      )}
"""
          repl = """                      {comp.nextMatchdayOpenAt && (
                        <div className={`text-[10px] flex items-center justify-between gap-2 rounded-lg px-2 py-1.5 border ${deadlineIsOverdue ? 'text-rose-300 bg-rose-500/10 border-rose-500/25' : 'text-slate-300 bg-slate-900/50 border-white/[0.04]'}`}>
                          <span className=\"flex items-center gap-1\">
                            <Clock className={`w-3 h-3 ${deadlineIsOverdue ? 'text-rose-400' : 'text-slate-500'}`} />
                            Deadline: {new Date(comp.nextMatchdayOpenAt).toLocaleString()}
                          </span>
                          {deadlineIsOverdue && <span className=\"font-black text-[9px] uppercase\">Overdue</span>}
                        </div>
                      )}
"""
          assert needle in s
          s = s.replace(needle, repl, 1)

          needle = """                      <div className=\"flex items-center gap-1.5\">
                        <button
                          onClick={() => handleRebuildStandings(comp.id)}
"""
          repl = """                      <button
                        onClick={() => handleSendMatchdayReminder(comp.id, currentMd, comp.nextMatchdayOpenAt)}
                        disabled={isProcessing}
                        className={`w-full py-1.5 px-2 rounded-lg text-[10px] font-black flex items-center justify-center gap-1.5 border ${deadlineIsOverdue ? 'bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border-rose-500/30' : 'bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border-amber-500/30'}`}
                        title=\"Only players who have not submitted this matchday are notified\"
                      >
                        <Send className=\"w-3 h-3\" />
                        <span>{deadlineIsOverdue ? 'Remind Overdue Players' : 'Remind Unfinished Players'}</span>
                      </button>

                      <div className=\"flex items-center gap-1.5\">
                        <button
                          onClick={() => handleRebuildStandings(comp.id)}
"""
          assert needle in s
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          # Add regression command and run it in CI.
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['test:matchday-reminder'] = 'node scripts/run-isolated-test.mjs src/server/tests/matchdayReminderRegressionTest.ts'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          needle = "          bun run test:matchday-locks\n"
          assert needle in s and "test:matchday-reminder" not in s
          s = s.replace(needle, needle + "          bun run test:matchday-reminder\n", 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: bun install
      - name: Regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:matchday-reminder
      - name: Lint
        run: bun run lint
      - name: Rebuild production bundle
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build
      - name: Commit generated feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/services/matchdayReminderService.ts src/server/routes/admin.routes.ts src/lib/api.ts src/components/AdminView.tsx src/server/tests/matchdayReminderRegressionTest.ts package.json .github/workflows/ci.yml api/index.js api/index.js.map
          git commit -m "feat(deadline): add matchday overdue reminders" || exit 0
          git push origin HEAD:feat/matchday-deadline-reminders
