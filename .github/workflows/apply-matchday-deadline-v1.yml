name: Apply matchday deadline v1
on:
  push:
    branches:
      - "feat/matchday-deadline-reminders"
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/matchday-deadline-reminders
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted patch
        run: node scripts/apply-matchday-deadline-v1.mjs
      - name: Install dependencies
        run: bun install
      - name: Regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:matchday-reminder
      - name: Lint
        run: bun run lint
      - name: Rebuild production bundle
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build
      - name: Commit generated feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/services/matchdayReminderService.ts src/server/routes/admin.routes.ts src/lib/api.ts src/components/AdminView.tsx src/server/tests/matchdayReminderRegressionTest.ts package.json .github/workflows/ci.yml api/index.js api/index.js.map
          git commit -m "feat(deadline): add matchday overdue reminders" || exit 0
          git push origin HEAD:feat/matchday-deadline-reminders
