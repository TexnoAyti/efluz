name: Incident login load regressions
on:
  push:
    branches:
      - fix/telegram-login-background-fanout-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: npm install -g bun@1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate login requests do not schedule background work
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
        run: node scripts/run-isolated-test.mjs src/server/tests/requestMaintenanceRegressionTest.ts
      - name: Validate 503 GETs are not retried
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
        run: node scripts/run-isolated-test.mjs src/server/tests/clientStartupRegressionTest.ts
