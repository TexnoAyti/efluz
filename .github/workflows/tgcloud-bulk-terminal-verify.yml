name: EFLUZ Telegram Serverless bulk terminal verification (no deploy)
on:
  push:
    branches:
      - feat/tgcloud-bulk-terminal-validation-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-telegram-serverless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca7a5cf5ce8c37f6
        with:
          bun-version: 1.3.3
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run whole Serverless suite in one terminal command
        run: node scripts/verifyEflTgcloudBatch.mjs
      - name: Typecheck native frontend adapters
        run: bun run lint
