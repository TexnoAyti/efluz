name: European Knockout Projection

on:
  push:
    branches:
      - fix/european-knockout-live-projection

permissions:
  contents: write

jobs:
  verify-and-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply live knockout projection patch
        run: python scripts/applyEuropeanKnockoutProjection.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Build and refresh tracked serverless bundle
        run: bun run build
      - name: European knockout projection regression
        run: node scripts/run-isolated-test.mjs src/server/tests/europeanKnockoutProjectionRegressionTest.ts
      - name: European tournament safety regression
        run: bun run test:european-safety
      - name: Read reduction regression
        run: bun run test:read-reduction
      - name: Data propagation regression
        run: bun run test:data-propagation
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChampionsLeagueView.tsx src/components/TournamentBracket.tsx src/server/tournament/knockoutEngine.ts src/server/tests/europeanKnockoutProjectionRegressionTest.ts api/index.js api/index.js.map
          git diff --cached --check
          git commit -m "fix(knockout): project live position-based European bracket"
          git push origin HEAD:fix/european-knockout-live-projection
