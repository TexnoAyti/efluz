name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Lint
        run: bun run lint

      - name: Run Build
        run: bun run build

      - name: Run Vercel Self-Check & Verification Suites
        run: |
          bun run test:deployment-selfcheck
          bun run test:tournament-architecture
          bun run test:quota-audit
          bun run test:vercel
