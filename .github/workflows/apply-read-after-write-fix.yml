name: Apply read-after-write consistency fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted source fix
        run: python scripts/applyReadAfterWriteFix.py
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bun run lint
      - name: Targeted regression
        run: bun run test:read-after-write
      - name: Existing propagation regression
        run: bun run test:data-propagation
      - name: Read budget regression
        run: bun run test:read-reduction
      - name: European safety regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:european-safety
      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build
      - name: Commit tested source fix
        run: |
          rm -f .github/workflows/apply-read-after-write-fix.yml scripts/applyReadAfterWriteFix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(results): preserve fresh fixture snapshots after admin save"
          git push origin HEAD:main
