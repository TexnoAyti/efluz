name: Apply read-after-write consistency fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply targeted source fix
        run: python scripts/applyReadAfterWriteFix.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Targeted regression
        run: npm run test:read-after-write
      - name: Existing propagation regression
        run: npm run test:data-propagation
      - name: Read budget regression
        run: npm run test:read-reduction
      - name: Production build
        run: npm run build
      - name: Commit tested source fix
        run: |
          rm -f .github/workflows/apply-read-after-write-fix.yml scripts/applyReadAfterWriteFix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(results): preserve fresh fixture snapshots after admin save"
          git push origin HEAD:main
