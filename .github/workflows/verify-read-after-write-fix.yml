name: Verify read-after-write consistency fix

on:
  push:
    branches:
      - main

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted source fix
        run: python scripts/applyReadAfterWriteFix.py
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bun run lint
      - name: Targeted regression
        run: bun run test:read-after-write
      - name: Existing propagation regression
        run: bun run test:data-propagation
      - name: Read budget regression
        run: bun run test:read-reduction
      - name: European safety regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run test:european-safety
      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build
      - name: Stage patched files
        run: |
          mkdir -p verified/src/server/readModel verified/src/server/routes verified/src/server/tests
          cp src/server/readModel/readModelStore.ts verified/src/server/readModel/
          cp src/server/routes/admin.routes.ts verified/src/server/routes/
          cp src/server/tests/readAfterWriteConsistencyRegressionTest.ts verified/src/server/tests/
          cp package.json verified/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: read-after-write-verified
          path: verified
          retention-days: 1
