name: Premium Hardening

on:
  push:
    branches: [feat/premium-private-lab]

permissions:
  contents: write

concurrency:
  group: premium-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-private-lab
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Apply hardening patch
        run: node scripts/patch-premium-hardening.mjs

      - name: Premium regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: node scripts/run-isolated-test.mjs src/server/tests/premiumPrivateLabRegressionTest.ts

      - name: TypeScript
        run: bun run lint

      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: "true"
          NODE_ENV: "test"
        run: bun run build

      - name: Commit hardened source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/premiumService.ts src/server/routes/telegram.routes.ts src/components/EflCareerCard.tsx api/index.js api/index.js.map
          if git diff --cached --quiet; then
            echo "Hardening already applied"
          else
            git commit -m "fix(premium): harden private beta checkout and access"
            git push origin HEAD:feat/premium-private-lab
          fi
