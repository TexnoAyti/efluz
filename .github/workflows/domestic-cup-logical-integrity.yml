name: Domestic Cup Logical Integrity

on:
  push:
    branches:
      - fix/domestic-cup-complete-bracket

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply logical integrity patch
        run: python scripts/applyDomesticCupLogicalIntegrity.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run lint
      - name: Build and refresh tracked serverless bundle
        run: bun run build
      - name: Full bracket regression
        run: bun run test:cup-full-bracket
      - name: Domestic cup safety regression
        run: bun run test:domestic-cup:isolated
      - name: Data propagation regression
        run: bun run test:data-propagation
      - name: Read reduction regression
        run: bun run test:read-reduction
      - name: Commit verified implementation and clean temp files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/domestic-cup-logical-integrity.yml scripts/applyDomesticCupLogicalIntegrity.py
          git add src/components/SofaBracketTree.tsx src/components/TournamentBracket.tsx src/server/tests/domesticCupFullBracketRegressionTest.ts api/index.js api/index.js.map
          git diff --cached --check
          git commit -m "fix(cups): validate complete domestic knockout paths"
          git push origin HEAD:fix/domestic-cup-complete-bracket
