name: Penalty goalkeeper regression
on:
  push:
    branches:
      - fix/penalty-keeper-save-physics-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: npm install -g bun@1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Penalty physics regression
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
        run: node scripts/run-isolated-test.mjs src/server/tests/penaltyKeeperPhysicsRegressionTest.ts
      - name: Verify game code parses
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import vm from 'node:vm';
            const html=fs.readFileSync('public/games/efl-penalty.html','utf8');
            const code=[...html.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]);
            for(const s of code)new vm.Script(s);
            console.log('PASS all penalty inline scripts parse');
          "
      - name: Build production client
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
        run: |
          bun run build
          node scripts/verify-startup-build.mjs
