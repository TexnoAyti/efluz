name: Incident background worker pause regression
on:
  push:
    branches:
      - fix/incident-pause-background-workers-20261111
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: npm install -g bun@1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate incident worker pause
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
          DISABLE_BACKGROUND_WORKERS: 'true'
        run: |
          node scripts/run-isolated-test.mjs src/server/tests/requestMaintenanceRegressionTest.ts
          node scripts/run-isolated-test.mjs src/server/tests/clientStartupRegressionTest.ts
          node --input-type=module -e "
            import fs from 'node:fs';
            const paths=['src/server/app.ts','src/server/sync/scheduleReconciliation.ts','src/server/services/uzeflifeNotifications.ts','src/server/services/telegramClubMemberTags.ts','src/server/services/telegramAiDailyReport.ts'];
            for(const path of paths){if(!fs.readFileSync(path,'utf8').includes('DISABLE_BACKGROUND_WORKERS'))throw Error('Missing pause guard: '+path)}
            console.log('Worker routes and schedules honor incident pause guard');
          "
      - name: Production build and startup self-check
        env:
          NODE_ENV: test
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
        run: |
          bun run build
          node scripts/verify-startup-build.mjs
