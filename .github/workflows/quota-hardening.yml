name: Apply Firestore quota hardening

on:
  push:
    branches: [fix/firestore-quota-hardening]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firestore-quota-hardening
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply targeted quota fix
        run: python scripts/applyFirestoreQuotaHardening.py
      - name: Install dependencies
        run: bun install
      - name: TypeScript
        run: bun run lint
      - name: Read reduction regression
        run: bun run test:read-reduction
      - name: Data propagation regression
        run: bun run test:data-propagation
      - name: European safety regression
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
          NODE_ENV: test
        run: bun run test:european-safety
      - name: Production build
        env:
          FIREBASE_FORCE_LOCAL_FALLBACK: 'true'
          NODE_ENV: test
        run: bun run build
      - name: Commit tested quota fix
        run: |
          rm -f .github/workflows/quota-hardening.yml scripts/applyFirestoreQuotaHardening.py quota-hardening-marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quota): prevent automatic broad Firestore reads"
          git push origin HEAD:fix/firestore-quota-hardening
