name: Telegram Serverless staging deploy (manual only)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Staging source branch"
        required: true
        type: string
        default: feat/tgcloud-staging-8533963416-20261111
      confirmation:
        description: "Only a separate staging bot is allowed"
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_STAGING_ONLY
        default: DO_NOT_DEPLOY

permissions:
  contents: read

concurrency:
  group: telegram-serverless-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ inputs.confirmation == 'DEPLOY_STAGING_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tgcloud-staging
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_STAGING_TOKEN }}
      TGCLOUD_STAGING_APP_ID: '8533963416'
      TGCLOUD_PRODUCTION_APP_ID: '8785073471'
      CONFIRM_TGCLOUD_STAGING_DEPLOY: ${{ inputs.confirmation }}
      EFL_SOURCE_DATABASE_URL: ${{ secrets.EFL_SOURCE_DATABASE_URL }}
      TGCLOUD_STAGING_OWNER_TELEGRAM_ID: ${{ secrets.TGCLOUD_STAGING_OWNER_TELEGRAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
      - name: Install pinned Bun
        run: npm install -g bun@1.3.3
      - name: Verify separate staging bot identity (fail closed)
        run: node scripts/verifyTgcloudStagingGate.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate existing migration and staging isolation before contacting Telegram
        run: |
          node --test scripts/serverlessStagingGate.test.mjs scripts/serverlessStagingIdentity.test.mjs
          node scripts/checkTgcloudModules.mjs
      - name: Prepare verified private staging import bundle
        run: |
          test -n "${EFL_SOURCE_DATABASE_URL}" || { echo "EFL_SOURCE_DATABASE_URL secret is required"; exit 1; }
          test -n "${TGCLOUD_STAGING_OWNER_TELEGRAM_ID}" || { echo "TGCLOUD_STAGING_OWNER_TELEGRAM_ID secret is required"; exit 1; }
          [[ "${TGCLOUD_STAGING_OWNER_TELEGRAM_ID}" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "INVALID_STAGING_OWNER_TELEGRAM_ID"; exit 1; }
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          export EFL_REQUIRE_OBSERVED_COUNTS=0
          bash scripts/exportEflSupabaseRuntime.sh "${RUNNER_TEMP}/efl-production.jsonl"
          bash scripts/prepareEflMigrationBundle.sh "${RUNNER_TEMP}/efl-production.jsonl" "${RUNNER_TEMP}/efl-migration-bundle"
          node scripts/verifyEflNormalizedPackets.mjs "${RUNNER_TEMP}/efl-migration-bundle/normalized-source.json" "${RUNNER_TEMP}/efl-migration-bundle/normalized-import"
      - name: Enable import only in this staging runner
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='tgcloud/lib/importControl.js';
          const owner=process.env.TGCLOUD_STAGING_OWNER_TELEGRAM_ID;
          if(!/^[1-9][0-9]{0,19}$/.test(owner||'')) throw new Error('INVALID_STAGING_OWNER_TELEGRAM_ID');
          let source=readFileSync(file,'utf8');
          const next=source.replace(
            /enabled:\s*false,\s*ownerTelegramId:\s*['"][^'"]*['"]/,
            `enabled:true, ownerTelegramId:'${owner}'`
          );
          if(next===source) throw new Error('IMPORT_CONTROL_TEMPLATE_NOT_FOUND');
          writeFileSync(file,next);
          NODE
      - name: Build actual EFLUZ React Serverless UI
        run: bun run build:tgcloud:real-ui
      - name: Stage actual EFLUZ UI as the isolated Mini App
        run: node scripts/stageEflRealUi.mjs
      - name: Verify actual UI excludes backend
        run: |
          node scripts/verifyEflServerlessUi.mjs
          EFL_VERIFY_REAL_UI=1 node scripts/verifyTgcloudStatic.mjs
      - name: Deploy to isolated staging bot only
        run: npx --yes --package=@tgcloud/cli tgcloud push --force
      - name: Review proposed staging schema changes (read-only)
        run: npx --yes --package=@tgcloud/cli tgcloud migrate --dry-run
      - name: Apply additive staging schema changes only
        run: npx --yes --package=@tgcloud/cli tgcloud migrate --safe
      - name: Import verified packets into staging only
        run: |
          bundle="${RUNNER_TEMP}/efl-migration-bundle/normalized-import"
          ctx="{initData:{user:{id:${TGCLOUD_STAGING_OWNER_TELEGRAM_ID}}}}"
          shopt -s nullglob
          tables=$(node --input-type=module - "${bundle}/manifest.json" <<'NODE'
          import {readFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile(process.argv[2],'utf8'));
          for (const table of manifest.order) if (manifest.tables[table]?.chunks?.length) console.log(table);
          NODE
          )
          for table in $tables; do
            files=( "${bundle}/${table}-"*.json )
            for file in "${files[@]}"; do
              echo "Importing ${table}/$(basename "${file}")"
              npx --yes --package=@tgcloud/cli tgcloud run endpoints/importBatch "$(<"${file}")" --ctx "${ctx}" >/tmp/tgcloud-import.log 2>&1 || {
                tail -40 /tmp/tgcloud-import.log
                exit 1
              }
            done
          done
          echo "STAGING_IMPORT_COMPLETE"
      - name: Verify staging runtime and imported account
        run: |
          ctx="{initData:{user:{id:${TGCLOUD_STAGING_OWNER_TELEGRAM_ID}}}}"
          run_readonly() {
            local module="$1"
            local input="$2"
            local log="/tmp/tgcloud-${module}.log"
            npx --yes --package=@tgcloud/cli tgcloud run "endpoints/${module}" "$input" --ctx "$ctx" >"$log" 2>&1 || {
              tail -40 "$log"
              exit 1
            }
            grep -q '"ok"[[:space:]]*:[[:space:]]*true' "$log" || {
              echo "STAGING_RUNTIME_CHECK_FAILED:${module}"
              tail -40 "$log"
              exit 1
            }
          }
          run_readonly health '{}'
          run_readonly seasons '{}'
          run_readonly bootstrap '{}'
          echo "STAGING_RUNTIME_CHECKS_OK"

