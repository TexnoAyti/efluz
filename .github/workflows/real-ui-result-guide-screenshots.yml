name: EFLUZ actual UI result guide screenshots

on:
  pull_request:
    paths:
      - 'src/components/FixturesView.tsx'
      - 'src/components/ResultSubmissionModal.tsx'
      - 'src/context/AuthContext.tsx'
      - 'src/lib/resultGuidePreviewData.ts'
      - 'src/App.tsx'
      - '.github/workflows/real-ui-result-guide-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Build exact EFLUZ frontend with preview enabled
        env:
          VERCEL_ENV: preview
        run: bunx vite build
      - name: Install headless browser
        run: |
          npx --yes playwright install chromium --with-deps
      - name: Launch built EFLUZ page
        run: |
          nohup bunx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/efluz-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/my-matches?designPreview=1 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/my-matches?designPreview=1 >/dev/null
      - name: Capture actual React UI components — NOT imagined graphics
        run: |
          mkdir -p artifacts/result-guide
          npx --yes playwright screenshot --browser chromium --viewport-size "430,932" --wait-for-timeout 3500 --full-page \
            "http://127.0.0.1:4173/my-matches?designPreview=1" \
            artifacts/result-guide/01-efluz-oyinlar-real-ui.png
          npx --yes playwright screenshot --browser chromium --viewport-size "430,932" --wait-for-timeout 3500 --full-page \
            "http://127.0.0.1:4173/my-matches?designPreview=1&guideModal=1" \
            artifacts/result-guide/02-efluz-hisob-kiritish-real-ui.png
      - name: Upload screenshot originals
        uses: actions/upload-artifact@v4
        with:
          name: efluz-actual-ui-result-entry
          path: artifacts/result-guide/*.png
          if-no-files-found: error
