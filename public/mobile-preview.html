<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EFL UZ · Mobile Design Preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #151b2a; font: 14px system-ui, sans-serif; }
      .frame { width: min(390px, 100%); height: min(844px, calc(100vh - 48px)); border: 7px solid #343f51; border-radius: 36px; overflow: hidden; box-shadow: 0 28px 80px #050912aa, inset 0 0 0 1px #8f9daf; background: #fff; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      @media (max-width: 450px) { body { padding: 0; } .frame { width: 100vw; height: 100dvh; border: 0; border-radius: 0; } }
    </style>
  </head>
  <body><div class="frame"><iframe title="EFL UZ 390px design preview" src="/?designPreview=1"></iframe></div></body>
</html>
